name: Release

# Cuts a new version on every push to main (docs-only changes excepted):
# computes vX.Y.Z, builds the macOS app (KasetMac scheme -> Spool.app),
# packages it as a DMG and a zip, then creates the tag and GitHub Release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only: upload the DMG/zip as a workflow artifact, no tag or release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DERIVED_DATA: build/release-dd
      DIST: build/dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git fetch --tags --force
          # major.minor comes from the KasetMac target's MARKETING_VERSION in project.yml.
          BASE=$(awk '/^  KasetMac:/{f=1} f && /MARKETING_VERSION:/{gsub(/[^0-9.]/, "", $2); print $2; exit}' project.yml)
          BASE=$(echo "$BASE" | cut -d. -f1-2)
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "Could not read MARKETING_VERSION from project.yml (got '$BASE')" >&2
            exit 1
          fi
          # Patch = highest existing vBASE.N tag + 1 (first release is vBASE.0).
          LAST=$(git tag -l "v${BASE}.*" | sed "s/^v${BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$LAST" ]; then PATCH=0; else PATCH=$((LAST + 1)); fi
          VERSION="${BASE}.${PATCH}"
          BUILD="${{ github.run_number }}"
          # Skip the release if this exact commit was already released (e.g. a re-run).
          EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=v$VERSION"
            echo "existing=$EXISTING"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (build $BUILD)${EXISTING:+, HEAD already tagged $EXISTING}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build Spool.app (Release, universal, ad-hoc signed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project KasetiOS.xcodeproj \
            -scheme KasetMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            | tail -n 50

      - name: Package DMG and zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/Spool.app"
          test -d "$APP" || { echo "Spool.app not found at $APP" >&2; exit 1; }
          codesign -dv "$APP"
          lipo -info "$APP/Contents/MacOS/Spool"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

          rm -rf "$DIST" && mkdir -p "$DIST/dmg-staging"
          ditto "$APP" "$DIST/dmg-staging/Spool.app"
          ln -s /Applications "$DIST/dmg-staging/Applications"
          hdiutil create \
            -volname "Spool $VERSION" \
            -srcfolder "$DIST/dmg-staging" \
            -fs HFS+ \
            -format UDZO \
            -ov "$DIST/Spool-$VERSION.dmg"
          rm -rf "$DIST/dmg-staging"

          ditto -c -k --keepParent "$APP" "$DIST/Spool-$VERSION-macOS.zip"
          ls -lh "$DIST"

      - name: Upload artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: Spool-${{ steps.version.outputs.version }}
          path: |
            build/dist/*.dmg
            build/dist/*.zip

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run && steps.version.outputs.existing == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Install on macOS

          Spool is ad-hoc signed and **not notarized** (there is no paid Apple Developer account behind it), so Gatekeeper will block the first launch.

          1. Download `Spool-<version>.dmg`, open it and drag **Spool** to **Applications**.
          2. On first launch, right-click Spool in Applications and choose **Open**, then confirm. (Or try to open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.)
          3. Alternatively, remove the quarantine flag from Terminal:
             ```bash
             xattr -dr com.apple.quarantine /Applications/Spool.app
             ```

          Requires macOS 26.
          EOF
          gh release create "$TAG" \
            "$DIST/Spool-$VERSION.dmg" \
            "$DIST/Spool-$VERSION-macOS.zip" \
            --target "$GITHUB_SHA" \
            --title "Spool $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
