name: Merge develop into main

# Once a day, fast-forwards main to develop so the day's merged PRs get released.
#
# - Only a fast-forward is done: main must never get commits that are not on develop.
#   If it has, the job fails and main has to be reconciled by hand.
# - develop's head commit must have passed CI (the checks main requires), otherwise
#   the job fails and main is left untouched until the next run.
# - Pushes made with GITHUB_TOKEN do not trigger other workflows, so the release
#   workflow is dispatched explicitly when the update contains non-documentation changes
#   (the same files release.yml ignores on push).
on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fast-forward main to develop
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main develop
          MAIN=$(git rev-parse origin/main)
          DEVELOP=$(git rev-parse origin/develop)

          if [ "$MAIN" = "$DEVELOP" ]; then
            echo "main is already up to date with develop."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$MAIN" "$DEVELOP"; then
            echo "::error::main has commits that are not on develop; merge main into develop with a PR first."
            exit 1
          fi

          for CHECK in "iOS (build + tests)" "macOS (build)"; do
            CONCLUSION=$(gh api "repos/$REPO/commits/$DEVELOP/check-runs" --paginate \
              --jq "[.check_runs[] | select(.name == \"$CHECK\")] | sort_by(.completed_at) | last | .conclusion // \"missing\"")
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::CI check '$CHECK' on develop ($DEVELOP) is '$CONCLUSION'; main was not updated."
              exit 1
            fi
          done

          git push origin "$DEVELOP:refs/heads/main"
          echo "main fast-forwarded from $MAIN to $DEVELOP."

          if git diff --name-only "$MAIN" "$DEVELOP" | grep -Ev '\.md$|^docs/' | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only changes, no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the release
        if: ${{ steps.sync.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref main
