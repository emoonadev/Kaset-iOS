name: KasetiOS
options:
  bundleIdPrefix: dev.emoona
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  KasetiOS:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - KasetiOSTests
    sources:
      - path: Sources
        excludes:
          - Mac
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Spool
        CFBundleLocalizations: [en, fr]
        CFBundleDevelopmentRegion: en
        # Read from build settings so the release workflow can stamp the version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.emoona.kaset.newReleases
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets you pull spike-log.txt out through the Files app / Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emoona.kaset
        PRODUCT_NAME: KasetiOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "1"
  # macOS app: same sources, with the original Kaset (macOS) layout — sidebar, player bar at the
  # bottom of the content, lyrics / queue panel on the right. Shell code lives in Sources/Mac.
  KasetMac:
    type: application
    platform: macOS
    scheme: {}
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Features/Shell/MainTabView.swift
          - Features/Shell/MiniPlayerView.swift
          - Features/NowPlaying/NowPlayingView.swift
          - Features/NowPlaying/QueueView.swift
          - Mac/KasetMacIcon.icon
      - path: Sources/Mac/KasetMacIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Spool
        CFBundleName: Spool
        # Read from build settings so the release workflow can stamp the version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr]
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: MIT License
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emoona.kaset.mac
        PRODUCT_NAME: Spool
        # Icon Composer icon: the iOS AppIcon artwork as two glass layers (docs/icon/make.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: KasetMacIcon
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
  KasetiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/KasetiOSTests
    dependencies:
      - target: KasetiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.emoona.kaset.tests
